name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: El tag coincide con packageVersion
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -nE 's/.*packageVersion = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          [ "$v" = "${GITHUB_REF_NAME#v}" ] || { echo "El tag $GITHUB_REF_NAME no coincide con packageVersion $v de app/build.gradle.kts" >&2; exit 1; }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./build.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ksqlc-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
